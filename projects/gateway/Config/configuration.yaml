#######################################################
# CART INVENTORY SENSORS (REST - Auto-refresh)
#######################################################
sensor:
  #######################################################
  # CART 142 — cart_inventory & BLE
  #######################################################
  - platform: rest
    name: "Cart 142 Inventory"
    unique_id: cart_142_inventory
    resource_template: "{{ states('input_text.api_base_http') }}/cart_inventory/142"
    method: GET
    scan_interval: 3600
    timeout: 5
    value_template: "{{ value_json.total | float(0) }}"
    json_attributes:
      - cart_id
      - items
    headers:
      Accept: "application/json"

  - platform: cart_ble
    address: "C0:2C:ED:90:AD:C3"
    cart: 142

  #######################################################
  # CART 105 — cart_inventory & BLE
  #######################################################
  - platform: rest
    name: "Cart 105 Inventory"
    unique_id: cart_105_inventory
    resource_template: "{{ states('input_text.api_base_http') }}/cart_inventory/105"
    method: GET
    scan_interval: 3600
    timeout: 5
    value_template: "{{ value_json.total | float(0) }}"
    json_attributes:
      - cart_id
      - items
    headers:
      Accept: "application/json"

  # - platform: cart_ble
  #   address: "C0:2C:ED:90:AD:C3"
  #   cart: 105

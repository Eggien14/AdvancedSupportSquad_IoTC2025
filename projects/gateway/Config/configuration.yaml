    max: 255
    mode: text
  map_510_new_beacon_d0:
    name: "Map 510 New Beacon D0 (Reference Distance)"
    max: 255
    mode: text
  map_510_new_beacon_n:
    name: "Map 510 New Beacon n (Path Loss Exponent)"
    max: 255

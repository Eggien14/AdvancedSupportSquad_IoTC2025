    mode: text
  cart_old_position_uuid:
    name: "Cart Old Position UUID"
    max: 255
    mode: text
  cart_old_state_uuid:
    name: "Cart Old State UUID"
    max: 255
    mode: text
  cart_old_voice_uuid:
    name: "Cart Old Voice UUID"
    max: 255
    mode: text
  cart_old_firmware_uuid:
    name: "Cart Old Firmware UUID"
    max: 255
    mode: text
  cart_old_camera_url:

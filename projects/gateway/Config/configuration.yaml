# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

mqtt:
  sensor:
    - name: "Shopping Cart Payload"
      state_topic: "product_detected_cart_id_142"
      value_template: "{{ value_json.total }}"
      json_attributes_topic: "product_detected"

logger:
  default: warning
  logs:
    custom_components.cart_ble: debug
    bleak: debug
    homeassistant.components.bluetooth: debug

input_text:
  # API Configuration - User can edit these directly
  api_base_http:
    name: API Base HTTP URL
    max: 255
    mode: text
  api_base_https:
    name: API Base HTTPS URL
    max: 255
    mode: text

  # Admin Cart Management
  admin_cart_list:
    name: "Admin Cart List"
    max: 255
    mode: text
  
  # Admin Map Management
  admin_map_list:
    name: "Admin Map List"
    max: 255
    mode: text
    
  map_entity_colour:
    name: "Map Entity Colour"
    max: 255
    mode: text
    
  admin_cart_map_connect:
    name: "Admin Cart Map Connect"
    max: 255
    mode: text
    
  # Cart New Config - Shared fields (comma-separated values in order of admin_cart_list)

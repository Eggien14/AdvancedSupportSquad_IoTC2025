services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password --character-set-client-handshake=FALSE --init-connect='SET NAMES utf8mb4'
    environment:
      - MYSQL_ROOT_PASSWORD=123456789
      - MYSQL_DATABASE=iotc25_advanced_support_squad
      - MYSQL_USER=eggien
      - MYSQL_PASSWORD=0363802865
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/db_init/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/db_insert/002_insert_product_master.sql:/docker-entrypoint-initdb.d/002_insert_product_master.sql:ro
      - ./db/db_insert/003_insert_cart_items.sql:/docker-entrypoint-initdb.d/003_insert_cart_items.sql:ro
      - ./db/db_insert/004_insert_cart_config.sql:/docker-entrypoint-initdb.d/004_insert_cart_config.sql:ro
      - ./db/db_insert/005_insert_map_beacon.sql:/docker-entrypoint-initdb.d/005_insert_map_beacon.sql:ro
      - ./db/db_insert/006_insert_map.sql:/docker-entrypoint-initdb.d/006_insert_map.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=eggien
      - DB_PASSWORD=0363802865
      - DB_NAME=iotc25_advanced_support_squad
      - API_PORT=8136
      - CACHE_ENABLED=true
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8136"  # Internal only, accessed via nginx
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8136/healthz')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx-proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8136:80"    # HTTP 
      - "8118:443"   # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/generate-ssl.sh:/etc/nginx/generate-ssl.sh:ro
      - nginx_certs:/etc/nginx/certs
    environment:
      - SERVER_IP=${SERVER_IP:-192.168.0.10}
    depends_on:
      api:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Starting Nginx Proxy Service...' &&
        apk add --no-cache openssl &&
        cp /etc/nginx/generate-ssl.sh /tmp/generate-ssl.sh &&
        chmod +x /tmp/generate-ssl.sh &&
        /tmp/generate-ssl.sh &&
        echo 'Waiting for API service to be ready...' &&
        sleep 5 &&
        echo 'API is healthy, starting nginx proxy...' &&
        nginx -g 'daemon off;'
      "
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3

  detector:
    build:
      context: .
      dockerfile: services/detector/Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8100:8100"

volumes:
  db_data:
  nginx_certs:
